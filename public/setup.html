<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskey — İlk Kurulum</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

    .setup-container {
      width: 100%;
      max-width: 480px;
    }

    .setup-card {
      background: var(--white);
      border-radius: var(--border-radius-xl);
      box-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.15);
      padding: 40px;
      border: 1px solid var(--slate-100);
      animation: loginFadeIn 0.4s ease;
    }

    .setup-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .setup-step {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--slate-200);
      transition: all 0.3s;
    }

    .setup-step.active {
      width: 24px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), #1d4ed8);
    }

    .setup-step.done {
      background: var(--primary);
    }

    .setup-subtitle {
      font-size: 13px;
      color: var(--slate-500);
      text-align: center;
      margin-bottom: 24px;
    }

    .setup-name-row {
      display: flex;
      gap: 12px;
    }

    .setup-name-row .login-form-group {
      flex: 1;
    }

    .setup-success {
      text-align: center;
      padding: 20px 0;
    }

    .setup-success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px -4px rgba(34, 197, 94, 0.35);
    }

    .setup-success h3 {
      font-size: 20px;
      color: var(--slate-900);
      margin-bottom: 8px;
    }

    .setup-success p {
      font-size: 14px;
      color: var(--slate-500);
      margin-bottom: 24px;
    }

    .password-strength {
      height: 3px;
      border-radius: 2px;
      background: var(--slate-100);
      margin-top: 8px;
      overflow: hidden;
    }

    .password-strength-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
      width: 0%;
    }

    .password-hint {
      font-size: 11px;
      color: var(--slate-400);
      margin-top: 4px;
    }
  </style>
</head>
<body class="login-body">
  <div class="setup-container">
    <div class="setup-card">
      <!-- Brand -->
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" width="28" height="28">
            <path d="m226-559 78 78q12 12 12 28.5T304-424q-12 12-28.5 12T247-424L141-530q-12-12-12-28.5t12-28.5l106-106q12-12 28.5-12t28.5 12q12 12 12 28.5T304-636l-78 77Zm254 239q-17 0-28.5-11.5T440-360q0-17 11.5-28.5T480-400h280q17 0 28.5 11.5T800-360q0 17-11.5 28.5T760-320H480Z"/>
          </svg>
        </div>
        <h1>Taskey Kurulumu</h1>
        <p>Yönetici hesabınızı oluşturun</p>
      </div>

      <!-- Steps indicator -->
      <div class="setup-steps">
        <div class="setup-step active" id="step-dot-1"></div>
        <div class="setup-step" id="step-dot-2"></div>
      </div>

      <!-- Step 1: Account Info -->
      <div id="setup-step-1">
        <p class="setup-subtitle">Kontrol panelinizi yönetecek ilk hesabı oluşturun</p>
        <form id="setup-form" autocomplete="on">
          <div class="login-form-group">
            <label for="setup-name">Ad Soyad</label>
            <input
              type="text"
              id="setup-name"
              name="name"
              placeholder="Adınız ve soyadınız"
              autocomplete="name"
              required
            />
          </div>
          <div class="login-form-group">
            <label for="setup-email">E-posta Adresi</label>
            <input
              type="email"
              id="setup-email"
              name="email"
              placeholder="ornek@domain.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="login-form-group">
            <label for="setup-password">Şifre</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="setup-password"
                name="password"
                placeholder="En az 6 karakter"
                autocomplete="new-password"
                minlength="6"
                required
              />
              <button type="button" class="password-toggle" id="setup-password-toggle" aria-label="Şifreyi göster">
                <svg id="setup-eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="20" height="20" fill="currentColor">
                  <path d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Z"/>
                </svg>
                <svg id="setup-eye-off-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="20" height="20" fill="currentColor">
                  <path d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-143.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q151 0 269 83.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-222q-35 11-70.5 16.5T480-200q-151 0-269-83.5T40-500q21-53 53-98.5t73-81.5L56-792l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 143.5 160.5T480-280q20 0 39-2.5t39-5.5l-36-38q-11 3-21 4.5t-21 1.5q-75 0-127.5-52.5T300-500q0-11 1.5-21t4.5-21l-84-82Z"/>
                </svg>
              </button>
            </div>
            <div class="password-strength">
              <div class="password-strength-fill" id="password-strength-fill"></div>
            </div>
            <p class="password-hint">En az 6 karakter kullanın</p>
          </div>
          <div class="login-form-group">
            <label for="setup-password-confirm">Şifre Tekrar</label>
            <div class="password-wrapper">
              <input
                type="password"
                id="setup-password-confirm"
                name="password-confirm"
                placeholder="Şifrenizi tekrar girin"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>
          </div>
          <button type="submit" class="login-submit" id="setup-submit">
            Hesabı Oluştur
          </button>
          <div class="login-error hidden" id="setup-error">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="18" height="18" fill="currentColor">
              <path d="m40-120 440-760 440 760H40Zm138-80h604L480-720 178-200Zm302-40q17 0 28.5-11.5T520-280q0-17-11.5-28.5T480-320q-17 0-28.5 11.5T440-280q0 17 11.5 28.5T480-240Zm-40-120h80v-200h-80v200Z"/>
            </svg>
            <span id="setup-error-text"></span>
          </div>
        </form>
      </div>

      <!-- Step 2: Success -->
      <div id="setup-step-2" class="hidden">
        <div class="setup-success">
          <div class="setup-success-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="32" height="32" fill="currentColor">
              <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/>
            </svg>
          </div>
          <h3>Kurulum Tamamlandı!</h3>
          <p>Yönetici hesabınız başarıyla oluşturuldu. Şimdi giriş yapabilirsiniz.</p>
          <button class="login-submit" id="setup-go-login">
            Giriş Sayfasına Git
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // If setup is already done, redirect to login
    (async () => {
      try {
        const res = await fetch("/api/setup/status");
        const data = await res.json();
        if (!data.needsSetup) {
          window.location.replace("/login.html");
          return;
        }
      } catch {
        // continue to show setup
      }
    })();

    const form = document.getElementById("setup-form");
    const nameInput = document.getElementById("setup-name");
    const emailInput = document.getElementById("setup-email");
    const passwordInput = document.getElementById("setup-password");
    const passwordConfirmInput = document.getElementById("setup-password-confirm");
    const submitBtn = document.getElementById("setup-submit");
    const errorBox = document.getElementById("setup-error");
    const errorText = document.getElementById("setup-error-text");
    const passwordToggle = document.getElementById("setup-password-toggle");
    const eyeIcon = document.getElementById("setup-eye-icon");
    const eyeOffIcon = document.getElementById("setup-eye-off-icon");
    const strengthFill = document.getElementById("password-strength-fill");

    // Password visibility toggle
    passwordToggle.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      eyeIcon.classList.toggle("hidden", isPassword);
      eyeOffIcon.classList.toggle("hidden", !isPassword);
    });

    // Password strength indicator
    passwordInput.addEventListener("input", () => {
      const val = passwordInput.value;
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const pct = Math.min(strength / 5 * 100, 100);
      strengthFill.style.width = pct + "%";
      if (pct <= 20) strengthFill.style.background = "#ef4444";
      else if (pct <= 40) strengthFill.style.background = "#f97316";
      else if (pct <= 60) strengthFill.style.background = "#eab308";
      else if (pct <= 80) strengthFill.style.background = "#22c55e";
      else strengthFill.style.background = "#16a34a";
    });

    // Submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const passwordConfirm = passwordConfirmInput.value;

      if (!name || !email || !password) {
        errorText.textContent = "Tüm alanları doldurun";
        errorBox.classList.remove("hidden");
        return;
      }

      if (password.length < 6) {
        errorText.textContent = "Şifre en az 6 karakter olmalıdır";
        errorBox.classList.remove("hidden");
        return;
      }

      if (password !== passwordConfirm) {
        errorText.textContent = "Şifreler eşleşmiyor";
        errorBox.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Oluşturuluyor...";

      try {
        const res = await fetch("/api/setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Show success step
          document.getElementById("setup-step-1").classList.add("hidden");
          document.getElementById("setup-step-2").classList.remove("hidden");
          document.getElementById("step-dot-1").classList.remove("active");
          document.getElementById("step-dot-1").classList.add("done");
          document.getElementById("step-dot-2").classList.add("active");
        } else {
          errorText.textContent = data.message || "Bir hata oluştu";
          errorBox.classList.remove("hidden");
        }
      } catch {
        errorText.textContent = "Sunucuya bağlanılamadı";
        errorBox.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Hesabı Oluştur";
      }
    });

    // Go to login
    document.getElementById("setup-go-login").addEventListener("click", () => {
      window.location.replace("/login.html");
    });
  </script>
</body>
</html>
