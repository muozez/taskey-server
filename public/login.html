<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskey — Giriş Yap</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
  </style>
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <!-- Brand -->
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" width="28" height="28">
            <path d="m226-559 78 78q12 12 12 28.5T304-424q-12 12-28.5 12T247-424L141-530q-12-12-12-28.5t12-28.5l106-106q12-12 28.5-12t28.5 12q12 12 12 28.5T304-636l-78 77Zm254 239q-17 0-28.5-11.5T440-360q0-17 11.5-28.5T480-400h280q17 0 28.5 11.5T800-360q0 17-11.5 28.5T760-320H480Z"/>
          </svg>
        </div>
        <h1>Taskey</h1>
        <p>Kontrol panelinize erişmek için giriş yapın</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" autocomplete="on">
        <div class="login-form-group">
          <label for="login-email">E-posta Adresi</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="ornek@taskey.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="login-form-group">
          <label for="login-password">Şifre</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Şifreyi göster">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="20" height="20" fill="currentColor">
                <path d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Z"/>
              </svg>
              <svg id="eye-off-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="20" height="20" fill="currentColor">
                <path d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-143.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q151 0 269 83.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-222q-35 11-70.5 16.5T480-200q-151 0-269-83.5T40-500q21-53 53-98.5t73-81.5L56-792l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 143.5 160.5T480-280q20 0 39-2.5t39-5.5l-36-38q-11 3-21 4.5t-21 1.5q-75 0-127.5-52.5T300-500q0-11 1.5-21t4.5-21l-84-82Z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="login-options">
          <label class="login-remember">
            <input type="checkbox" id="login-remember" />
            <span>Beni hatırla</span>
          </label>
        </div>
        <button type="submit" class="login-submit" id="login-submit">
          Giriş Yap
        </button>
        <div class="login-error hidden" id="login-error">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" width="18" height="18" fill="currentColor">
            <path d="m40-120 440-760 440 760H40Zm138-80h604L480-720 178-200Zm302-40q17 0 28.5-11.5T520-280q0-17-11.5-28.5T480-320q-17 0-28.5 11.5T440-280q0 17 11.5 28.5T480-240Zm-40-120h80v-200h-80v200Z"/>
          </svg>
          <span id="login-error-text">Geçersiz e-posta veya şifre</span>
        </div>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <p>Demo: <strong>admin@taskey.com</strong> / <strong>123456</strong></p>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    // If already logged in (and token is valid), redirect to dashboard
    Auth.redirectIfAuthenticated();

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("login-email");
    const passwordInput = document.getElementById("login-password");
    const submitBtn = document.getElementById("login-submit");
    const errorBox = document.getElementById("login-error");
    const errorText = document.getElementById("login-error-text");
    const passwordToggle = document.getElementById("password-toggle");
    const eyeIcon = document.getElementById("eye-icon");
    const eyeOffIcon = document.getElementById("eye-off-icon");

    // Toggle password visibility
    passwordToggle.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      eyeIcon.classList.toggle("hidden", isPassword);
      eyeOffIcon.classList.toggle("hidden", !isPassword);
    });

    // Submit form
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Giriş yapılıyor...";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            password: passwordInput.value,
          }),
        });

        const data = await res.json();

        if (res.ok && data.token) {
          const remember = document.getElementById("login-remember").checked;
          Auth.setCredentials(data.token, data.user, remember);
          window.location.replace("/");
        } else {
          errorText.textContent = data.message || "Geçersiz e-posta veya şifre";
          errorBox.classList.remove("hidden");
        }
      } catch {
        errorText.textContent = "Sunucuya bağlanılamadı";
        errorBox.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Giriş Yap";
      }
    });
  </script>
</body>
</html>
