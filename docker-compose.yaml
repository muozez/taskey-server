services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taskey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskey
      POSTGRES_USER: taskey
      POSTGRES_PASSWORD: taskey_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskey -d taskey"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ── Node.js App (scalable) ────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskey
      DB_USER: taskey
      DB_PASS: taskey_secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── Nginx reverse proxy / load balancer ───────────────────
  nginx:
    image: nginx:alpine
    container_name: taskey-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - external
      - internal

volumes:
  pgdata:

networks:
  external:
    driver: bridge
  internal:
    driver: bridge
    internal: true
